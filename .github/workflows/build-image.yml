name: Build runtime image

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  ECR_REPO: 362353308385.dkr.ecr.us-east-1.amazonaws.com/open-label-runtime

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::362353308385:role/open-label-staging-gha
          aws-region: us-east-1

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.ECR_REPO }}:develop
            ${{ env.ECR_REPO }}:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/opentrain-ai/open-label-runtime:buildcache
          cache-to: type=registry,ref=ghcr.io/opentrain-ai/open-label-runtime:buildcache,mode=max

      - name: Deploy to ECS staging
        run: |
          status=$(aws ecs describe-services --cluster open-label-staging --services open-label-staging \
            --query 'services[0].status' --output text 2>/dev/null || echo "MISSING")
          if [ "$status" = "ACTIVE" ]; then
            aws ecs update-service --cluster open-label-staging --service open-label-staging \
              --force-new-deployment > /dev/null
            aws ecs wait services-stable --cluster open-label-staging --services open-label-staging
          else
            echo "ECS service not created yet (status: $status); skipping deploy"
          fi
